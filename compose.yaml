x-app: &app
  build: .
  image: retail-pricing:local
  environment:
    DATABASE_URL: postgresql+psycopg://retail:retail@db:5432/retail
    API_URL: http://api:8000
    PROJECT_ROOT: /app
  volumes:
    - ./data:/app/data
    - ./artifacts:/app/artifacts
    - ./reports:/app/reports
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 5s
      timeout: 5s
      retries: 10
  pipeline:
    <<: *app
    profiles: [setup]
    command: ["retail-pricing", "setup"]
  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  dashboard:
    <<: *app
    command: ["streamlit", "run", "dashboard/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
