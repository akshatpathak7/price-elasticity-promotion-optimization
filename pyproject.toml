[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retail-pricing"
version = "0.1.0"
description = "An explainable retail price and promotion decision workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<3", "numpy>=2,<3", "scipy>=1.14,<2",
  "statsmodels>=0.14,<0.15", "scikit-learn>=1.6,<2", "xgboost>=3,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2",
  "streamlit>=1.42,<2", "plotly>=6,<7", "httpx>=0.28,<1",
  "python-calamine>=0.3,<1", "pyarrow>=19,<24", "joblib>=1.4,<2"
]
[project.scripts]
retail-pricing = "retail_pricing.cli:main"
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "nbformat>=5,<6", "nbconvert>=7,<8", "ipykernel>=6,<8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.hatch.build.targets.wheel]
packages = ["src/retail_pricing"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
